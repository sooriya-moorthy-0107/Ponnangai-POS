services:
  pos-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ponnangai_pos_app
    ports:
      - "1745:8000"
    volumes:
      # Bind mount the SQLite database to persist data outside the container lifecycle
      - ./ponnangai_pos.db:/app/ponnangai_pos.db
      # Bind mount the photos directory to keep uploaded product images safe
      - ./photos:/app/photos
    restart: unless-stopped
