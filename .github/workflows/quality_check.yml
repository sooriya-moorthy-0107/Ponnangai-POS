name: Ponnangai POS Quality Check

# This section fixes your "No event triggers" error
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run this manually from the GitHub UI

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # We include the core libraries you are using on localhost
          pip install flake8 fastapi uvicorn 

      - name: Syntax & Error Check (Linting)
        run: |
          # Fails the build if there are critical Python errors
          # E9, F63, F7, and F82 are "logic breakers"
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          
          # This part shows warnings but won't stop the build (exit-zero)
          # It helps you keep your code clean for your M.Tech review
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: FastAPI Import Test (Dry Run)
        run: |
          # Ensures your main.py is formatted correctly and can be loaded
          python -c "import main; print('Backend Logic: OK')"